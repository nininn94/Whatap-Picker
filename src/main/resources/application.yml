spring:
  application:
    name: whatap-picker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:picker}
    username: ${DB_USER:picker}
    password: ${DB_PASSWORD:picker}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
      hibernate.format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

  ai:
    model:
      embedding: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: when_missing
        timeout: 5m
        chat:
          additional-models: []
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5:1.5b}
          temperature: 0.0
          num-ctx: 2048
          num-predict: 200
          top-p: 0.9

server:
  port: 8080
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: 8
  rate-limit:
    login-attempts-per-15min: 5
    lead-submit-per-min-per-ip: 10
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000

bootstrap:
  admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

lead:
  blocked-email-domains:
    - gmail.com
    - naver.com
    - empas.com
    - nate.com
    - daum.net
    - hanmail.net
    - hotmail.com
    - yahoo.co.kr
    - icloud.com
    - outlook.com
    - kakao.com
  retention-months: 24

draw:
  pool-strategy: pre-random

ai-scoring:
  enabled: true
  timeout-seconds: 15
  retry:
    max-attempts: 3
    initial-delay-ms: 30000
    multiplier: 10

logging:
  level:
    io.whatap.picker: INFO
    org.springframework.ai: INFO
