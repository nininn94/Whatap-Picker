<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head(title='경품 재고 관리')}"></head>
<body class="admin-body">
<nav th:replace="~{admin/layout :: nav('events')}"></nav>

<main class="admin-container" th:attr="data-event-id=${event.id}">
    <header class="page-header">
        <div class="title-block">
            <p class="breadcrumb">
                <a th:href="@{/admin}">홈</a><span class="sep">›</span>
                <a th:href="@{/admin/events}">행사</a><span class="sep">›</span>
                <code th:text="${event.eventCode}"></code>
            </p>
            <h1 th:text="|${event.label} · 경품 재고|"></h1>
            <p class="subtitle">
                상태 <span th:class="'status-badge status-' + ${event.status}" th:text="${event.status}"></span>
                · 폼 잠금 <strong th:text="${event.formLocked ? '🔒 잠김 (응답 시작됨)' : '🔓 열림'}"></strong>
            </p>
        </div>
        <div class="actions">
            <a class="btn btn-secondary" th:href="@{/admin/leads(eventCode=${event.eventCode})}">리드 보기</a>
            <a class="btn btn-secondary" th:href="@{|/event/${event.eventCode}/qr|}" target="_blank">QR 띄우기</a>
            <button class="btn btn-secondary" onclick="addRow()">+ 등수 추가</button>
            <button class="btn btn-primary"   onclick="saveAll()">전체 저장</button>
        </div>
    </header>

    <div class="card">
        <table id="prize-table">
            <thead>
            <tr>
                <th style="width:70px;">등수</th>
                <th>경품명</th>
                <th style="width:110px;">초기 수량</th>
                <th style="width:70px;">당첨</th>
                <th style="width:70px;">잔여</th>
                <th style="width:90px;">소진율</th>
                <th style="width:90px;">액션</th>
            </tr>
            </thead>
            <tbody id="prize-body">
            <tr th:each="p : ${prizes}" th:attr="data-id=${p.id}">
                <td><input type="number" min="1" th:value="${p.rank}" class="rank-input" readonly></td>
                <td><input type="text" th:value="${p.name}" class="name-input"></td>
                <td><input type="number" min="0" th:value="${p.initialQty}" class="initial-input"></td>
                <td th:text="${p.initialQty - p.remainingQty}"></td>
                <td th:text="${p.remainingQty}"></td>
                <td>
                    <span th:text="${#numbers.formatPercent((p.initialQty - p.remainingQty) * 1.0 / (p.initialQty == 0 ? 1 : p.initialQty), 1, 0)}"></span>
                </td>
                <td><button class="btn btn-sm btn-danger" onclick="deletePrize(this)">삭제</button></td>
            </tr>
            <tr th:if="${#lists.isEmpty(prizes)}">
                <td colspan="7" style="text-align:center; padding:24px 0;" class="muted">
                    등록된 경품이 없습니다. "+ 등수 추가"로 시작하세요.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script>
    const eventId = document.querySelector('main').dataset.eventId;

    function addRow() {
        const tbody = document.getElementById('prize-body');
        const empty = tbody.querySelector('tr td[colspan]');
        if (empty) empty.closest('tr').remove();

        const used = [...tbody.querySelectorAll('.rank-input')].map(i => parseInt(i.value, 10) || 0);
        let nextRank = 1;
        while (used.includes(nextRank)) nextRank++;

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="number" min="1" value="${nextRank}" class="rank-input"></td>
            <td><input type="text" placeholder="경품명" class="name-input"></td>
            <td><input type="number" min="0" value="1" class="initial-input"></td>
            <td>-</td><td>-</td><td>-</td>
            <td><button class="btn btn-sm btn-secondary" onclick="this.closest('tr').remove()">취소</button></td>`;
        tbody.appendChild(tr);
    }

    async function saveAll() {
        const rows = [...document.querySelectorAll('#prize-body tr[data-id], #prize-body tr:not([data-id])')];
        const prizes = rows
            .filter(r => r.querySelector('.name-input'))
            .map(r => ({
                rank: parseInt(r.querySelector('.rank-input').value, 10),
                name: (r.querySelector('.name-input').value || '').trim(),
                initialQty: parseInt(r.querySelector('.initial-input').value, 10)
            }))
            .filter(p => p.name && p.rank > 0 && Number.isInteger(p.initialQty) && p.initialQty >= 0);

        if (prizes.length === 0) { toast('저장할 경품이 없습니다.', true); return; }

        try {
            await adminApi.post(`/api/admin/events/${eventId}/prizes`, { prizes });
            toast('저장되었습니다.');
            setTimeout(() => location.reload(), 500);
        } catch (e) { toast(e.message, true); }
    }

    async function deletePrize(btn) {
        const row = btn.closest('tr');
        const id = row.dataset.id;
        if (!id) { row.remove(); return; }
        if (!confirm('이 경품을 삭제하시겠습니까? (이미 당첨 이력이 있으면 거부됩니다.)')) return;
        try {
            await adminApi.del(`/api/admin/prizes/${id}`);
            toast('삭제되었습니다.');
            row.remove();
        } catch (e) { toast(e.message, true); }
    }
</script>
<div th:replace="~{admin/layout :: scripts}"></div>
</body>
</html>
