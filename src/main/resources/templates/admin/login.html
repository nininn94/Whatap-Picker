<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head(title='어드민 로그인')}"></head>
<body class="login-shell">
<main>
    <div class="card">
        <div class="brand-mark">WhaTap Picker</div>
        <h1 style="margin:0 0 4px; font-size:1.25rem;">관리자 로그인</h1>
        <p class="muted" style="margin-top:0;">관리자 / 운영자 계정으로 로그인하세요.</p>

        <form id="login-form" onsubmit="return submitLogin(event)" style="display:flex; flex-direction:column; gap:14px; margin-top:18px;">
            <label style="display:flex; flex-direction:column; gap:4px;">
                <span style="font-weight:600;">아이디(ID)</span>
                <input type="text" name="username" required autocomplete="username" style="width:100%;">
            </label>
            <label style="display:flex; flex-direction:column; gap:4px;">
                <span style="font-weight:600;">비밀번호</span>
                <input type="password" name="password" required autocomplete="current-password" style="width:100%;">
            </label>
            <button type="submit" class="btn btn-primary btn-lg">로그인</button>
            <p id="login-error" class="error" style="display:none;"></p>
        </form>
    </div>
</main>
<script>
    async function submitLogin(e) {
        e.preventDefault();
        const form = e.target;
        const data = { username: form.username.value, password: form.password.value };
        const err = document.getElementById('login-error');
        err.style.display = 'none';
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify(data)
            });
            if (!res.ok) {
                const body = await res.json().catch(() => ({ message: '로그인 실패' }));
                err.textContent = body.message || '로그인 실패';
                err.style.display = 'block';
                return false;
            }
            const json = await res.json();
            localStorage.setItem('jwt', json.accessToken);
            const params = new URLSearchParams(window.location.search);
            window.location.href = params.get('next') || '/admin';
            return false;
        } catch (ex) {
            err.textContent = '네트워크 오류';
            err.style.display = 'block';
            return false;
        }
    }
</script>
<div th:replace="~{admin/layout :: scripts}"></div>
</body>
</html>
