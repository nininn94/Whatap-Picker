<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head(title='폼 편집')}"></head>
<body class="admin-body">
<nav th:replace="~{admin/layout :: nav('forms')}"></nav>

<main class="admin-container" th:attr="data-form-id=${formId}">
    <header class="page-header">
        <div class="title-block">
            <p class="breadcrumb">
                <a th:href="@{/admin}">홈</a><span class="sep">›</span>
                <a th:href="@{/admin/forms}">폼 템플릿</a><span class="sep">›</span>편집
            </p>
            <h1 id="form-title">불러오는 중...</h1>
            <p class="subtitle">
                ⚠️ 시스템 핵심 키(firstName/lastName/phone/email/jobFunction/monitoringStatus/privacyConsent/marketingConsent 등)는 누락 시 저장 불가.
                시스템 기본 템플릿(잠금)은 수정 불가 — 복사 후 편집하세요.
            </p>
        </div>
        <div class="actions">
            <a class="btn btn-secondary" th:href="@{/admin/forms}">← 폼 목록</a>
            <button class="btn btn-secondary" onclick="validateJson()">JSON 검증</button>
            <button class="btn btn-primary"   onclick="saveForm()">저장</button>
        </div>
    </header>

    <div class="card">
        <textarea id="schema-editor" class="json-editor" spellcheck="false"></textarea>
        <p id="validate-result" style="margin-top: 8px;"></p>
    </div>
</main>

<script>
    const formId = document.querySelector('main').dataset.formId;
    let currentVersion = 0;
    let currentName = '';

    async function load() {
        try {
            const data = await adminApi.get(`/api/admin/forms/${formId}`);
            currentName = data.name;
            document.getElementById('form-title').textContent =
                `${data.name} (v${data.version}${data.systemDefault ? ' · 🔒 시스템 기본' : ''})`;
            currentVersion = data.version;
            document.getElementById('schema-editor').value = JSON.stringify(data.schema, null, 2);
        } catch (e) {
            document.getElementById('form-title').textContent = '로드 실패';
            toast(e.message, true);
        }
    }

    function parseSchema() {
        try {
            return { ok: true, value: JSON.parse(document.getElementById('schema-editor').value) };
        } catch (e) {
            return { ok: false, error: e.message };
        }
    }

    function validateJson() {
        const r = parseSchema();
        const el = document.getElementById('validate-result');
        if (r.ok) {
            el.style.color = 'var(--success)';
            el.textContent = '✅ JSON 형식 유효';
        } else {
            el.style.color = 'var(--danger)';
            el.textContent = '❌ ' + r.error;
        }
    }

    async function saveForm() {
        const r = parseSchema();
        if (!r.ok) { toast('JSON 파싱 실패: ' + r.error, true); return; }
        const name = prompt('템플릿 이름을 변경할까요? (취소하면 기존 이름 유지)', currentName) || currentName;
        try {
            const res = await adminApi.put(`/api/admin/forms/${formId}`,
                { name, schema: r.value, version: currentVersion });
            currentVersion = res.version;
            currentName = name;
            document.getElementById('form-title').textContent = `${name} (v${res.version})`;
            toast(`저장되었습니다 (v${res.version}).`);
        } catch (e) { toast(e.message, true); }
    }

    load();
</script>
<div th:replace="~{admin/layout :: scripts}"></div>
</body>
</html>
