<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head(title='폼 템플릿')}"></head>
<body class="admin-body">
<nav th:replace="~{admin/layout :: nav('forms')}"></nav>

<main class="admin-container">
    <header class="page-header">
        <div class="title-block">
            <p class="breadcrumb"><a th:href="@{/admin}">홈</a><span class="sep">›</span>폼 템플릿</p>
            <h1>폼 템플릿</h1>
            <p class="subtitle">시스템 기본 템플릿도 직접 편집할 수 있습니다(삭제 차단). 안전을 위해 <strong>복사 후 편집</strong>을 권장합니다.</p>
        </div>
    </header>

    <div class="card">
        <div id="form-list" class="muted">불러오는 중...</div>
    </div>
</main>

<script>
    async function load() {
        try {
            const list = await adminApi.get('/api/admin/forms');
            const rows = list.map(f => `
                <tr>
                    <td><strong>${f.name}</strong></td>
                    <td>${f.isSystemDefault
                        ? '<span class="badge status-ARCHIVED">🔒 시스템 기본</span>'
                        : '<span class="badge status-OPEN">커스텀</span>'}</td>
                    <td>v${f.version}</td>
                    <td>${new Date(f.updatedAt).toLocaleString()}</td>
                    <td>
                        <div class="btn-group">
                        ${f.isSystemDefault
                            ? `<button class="btn btn-sm btn-secondary" onclick='clonePrompt("${f.id}", "${f.name}")'>복사</button>`
                            : `<a class="btn btn-sm btn-secondary" href="/admin/forms/${f.id}/edit">편집</a>
                               <button class="btn btn-sm btn-secondary" onclick='clonePrompt("${f.id}", "${f.name}")'>복사</button>
                               <button class="btn btn-sm btn-danger" onclick='deleteForm("${f.id}", "${f.name}")'>삭제</button>`}
                        </div>
                    </td>
                </tr>`).join('');
            document.getElementById('form-list').innerHTML = `<table>
                <thead><tr><th>이름</th><th>유형</th><th>버전</th><th>수정일</th><th>액션</th></tr></thead>
                <tbody>${rows}</tbody></table>`;
        } catch (e) {
            document.getElementById('form-list').innerHTML = '<p class="error">로드 실패: ' + e.message + '</p>';
        }
    }

    async function clonePrompt(sourceId, srcName) {
        const name = prompt('새 폼 이름:', srcName + ' (복사)');
        if (!name) return;
        try {
            const r = await adminApi.post('/api/admin/forms/clone', { sourceId, name });
            toast('복사 완료');
            window.location.href = `/admin/forms/${r.id}/edit`;
        } catch (e) { toast(e.message, true); }
    }

    async function deleteForm(id, name) {
        if (!confirm(`'${name}' 템플릿을 삭제하시겠습니까? (사용 중인 행사가 있으면 거부됩니다.)`)) return;
        try {
            await adminApi.del(`/api/admin/forms/${id}`);
            toast('삭제되었습니다.');
            load();
        } catch (e) { toast(e.message, true); }
    }

    load();
</script>
<div th:replace="~{admin/layout :: scripts}"></div>
</body>
</html>
