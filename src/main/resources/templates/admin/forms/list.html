<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head(title='폼 템플릿')}"></head>
<body>
<nav th:replace="~{admin/layout :: nav}"></nav>
<main class="admin-container">
    <h1>폼 템플릿</h1>
    <div class="card">
        <p class="muted">시스템 기본 템플릿은 잠금되어 있습니다. 복사 후 커스텀하세요.</p>
        <div id="form-list">불러오는 중...</div>
    </div>
</main>
<script>
    async function load() {
        try {
            const list = await adminApi.get('/api/admin/forms');
            const rows = list.map(f => `
                <tr>
                    <td>${f.name}</td>
                    <td>${f.isSystemDefault ? '🔒 시스템 기본' : '커스텀'}</td>
                    <td>v${f.version}</td>
                    <td>${new Date(f.updatedAt).toLocaleString()}</td>
                    <td>
                        ${f.isSystemDefault
                            ? `<button class="btn btn-secondary" onclick='clonePrompt("${f.id}", "${f.name}")'>복사</button>`
                            : `<a class="btn btn-secondary" href="/admin/forms/${f.id}/edit">편집</a>
                               <button class="btn btn-secondary" onclick='clonePrompt("${f.id}", "${f.name}")'>복사</button>
                               <button class="btn btn-danger" onclick='deleteForm("${f.id}", "${f.name}")'>삭제</button>`}
                    </td>
                </tr>`).join('');
            document.getElementById('form-list').innerHTML = `<table>
                <thead><tr><th>이름</th><th>유형</th><th>버전</th><th>수정일</th><th>액션</th></tr></thead>
                <tbody>${rows}</tbody></table>`;
        } catch (e) {
            document.getElementById('form-list').innerHTML = '<p>로드 실패: ' + e.message + '</p>';
        }
    }

    async function clonePrompt(sourceId, srcName) {
        const name = prompt('새 폼 이름:', srcName + ' (복사)');
        if (!name) return;
        try {
            const r = await adminApi.post('/api/admin/forms/clone', { sourceId, name });
            toast('복사 완료');
            window.location.href = `/admin/forms/${r.id}/edit`;
        } catch (e) { toast(e.message, true); }
    }

    async function deleteForm(id, name) {
        if (!confirm(`'${name}' 템플릿을 삭제하시겠습니까? (사용 중인 행사가 있으면 거부됩니다.)`)) return;
        try {
            await adminApi.del(`/api/admin/forms/${id}`);
            toast('삭제되었습니다.');
            load();
        } catch (e) { toast(e.message, true); }
    }

    load();
</script>
<div th:replace="~{admin/layout :: scripts}"></div>
</body>
</html>
