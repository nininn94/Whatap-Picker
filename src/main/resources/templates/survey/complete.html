<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='제출 완료')}"></head>
<body class="survey complete">
<main class="container">
    <div class="thank-you">
        <h1 th:text="${thankYou != null ? thankYou.get('headline').asText() : '설문에 참여해 주셔서 감사합니다.'}"></h1>
        <p class="highlight"
           th:text="${thankYou != null ? thankYou.get('subhead').asText() : '완료하신 분께서는 이 화면을 직원에게 보여 주세요!'}"></p>
        <pre class="body"
             th:text="${thankYou != null ? thankYou.get('body').asText() : 'WhaTap에 대한 자세한 정보는 event@whatap.io로 문의 부탁드립니다.'}"></pre>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
